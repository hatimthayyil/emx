[package]
name = "emx"
version = "0.1.0"
edition = "2024"
description = "Builds emx's Emacs and its Elisp packages into emx's Nix profile"
# Linking dix (GPL-3.0-only) makes the compiled binary GPL-3.0-only.
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dix = { version = "3", default-features = false, features = ["store"] }
lexpr = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yansi = "1"

[dev-dependencies]
tempfile = "3"
